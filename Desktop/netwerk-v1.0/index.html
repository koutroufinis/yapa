<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Netwerk</title>

    <link rel="stylesheet" href="resources/static/css/index.css">

    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237C3AED'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E"
    >
</head>

<body>

    <main class="container">

        <div class="brand">
            <div class="logo">N</div>

            <h1>Netwerk</h1>

            <p id="subtitle">Welcome back</p>
        </div>

        <div class="auth-box" id="authBox">

            <div class="form-wrapper">

                <p class="form-message" id="authMessage" role="status" aria-live="polite" hidden></p>

                <form class="auth-form active" id="loginForm">

                    <h2>Login</h2>

                    <p class="form-description">
                        Sign in to your Netwerk account
                    </p>

                    <div class="input-group">
                        <input
                            type="text"
                            name="username"
                            id="login_username"
                            placeholder="Username"
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            name="password"
                            id="login_password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <label class="remember-me" for="remember_me">
                        <input id="remember_me" name="remember_me" type="checkbox">
                        <span>Remember me for 30 days</span>
                    </label>

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        <span>Login</span>
                        <span class="arrow">→</span>
                    </button>

                    <p class="switch-text">
                        Don't have an account?

                        <button
                            type="button"
                            class="switch-button"
                            id="showSignup"
                        >
                            Sign Up
                        </button>
                    </p>

                </form>

                <form class="auth-form" id="signupForm">

                    <h2>Create Account</h2>

                    <p class="form-description">
                        Join the Netwerk community
                    </p>

                    <div class="input-group">
                        <input
                            type="text"
                            name="username"
                            id="signup_username"
                            placeholder="Username"
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="email"
                            name="email"
                            id="signup_email"
                            placeholder="Email"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            name="password"
                            id="signup_password"
                            placeholder="Password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            placeholder="Confirm Password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        <span>Create Account</span>
                        <span class="arrow">→</span>
                    </button>

                    <p class="switch-text">
                        Already have an account?

                        <button
                            type="button"
                            class="switch-button"
                            id="showLogin"
                        >
                            Login
                        </button>
                    </p>

                </form>

            </div>

        </div>

        <section class="auth-box dashboard" id="dashboard" aria-live="polite" hidden>
            <h2>You're signed in</h2>
            <p class="form-description" id="dashboardEmail"></p>
            <p class="form-message" id="dashboardMessage" role="status" aria-live="polite" hidden></p>
            <a class="auth-button chat-link" href="/interface">
                <span>Open Chat</span>
                <span class="arrow">→</span>
            </a>
            <button type="button" class="auth-button" id="logoutButton">
                <span>Log Out</span>
            </button>
        </section>

        <footer>
            <p>© 2026 Koutroufinis</p>
        </footer>

    </main>

    <script src="/resources/static/js/logic.js"></script>
    <script src="resources/static/js/index.js"></script>

</body>
</html>
