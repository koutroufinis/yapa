<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Netwerk</title>

    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237C3AED'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #07070a;
            --card: rgba(16, 16, 22, 0.88);
            --input: #0c0c11;
            --border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --gray: #858591;
            --purple: #7c3aed;
            --purple-light: #8b5cf6;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(124, 58, 237, 0.22),
                    transparent 35%
                ),
                var(--background);
            color: var(--white);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            animation: appear 0.6s ease;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            background: linear-gradient(
                135deg,
                var(--purple-light),
                var(--purple)
            );
            font-size: 30px;
            font-weight: 800;
            box-shadow: 0 12px 35px rgba(124, 58, 237, 0.35);
        }

        h1 {
            font-size: 28px;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }

        .description {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .verification-message {
            margin-top: 15px;
            color: #c4b5fd;
            font-size: 13px;
            line-height: 1.5;
        }

        .verification-message.error {
            color: #fca5a5;
        }

        .verification {
            width: 100%;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .code-input {
            width: 100%;
            height: 58px;
            padding: 0 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            outline: none;
            background: var(--input);
            color: white;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 9px;
            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .code-input::placeholder {
            color: #45454f;
            letter-spacing: 5px;
        }

        .code-input:focus {
            border-color: var(--purple-light);
            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.14),
                0 0 25px rgba(124, 58, 237, 0.08);
        }

        .verify-button {
            width: 100%;
            height: 52px;
            margin-top: 15px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(
                135deg,
                var(--purple-light),
                var(--purple)
            );
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.25);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .verify-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 17px 38px rgba(124, 58, 237, 0.38);
        }

        .verify-button:active {
            transform: scale(0.98);
        }

        .verify-button:disabled,
        .resend button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .resend {
            margin-top: 20px;
            color: var(--gray);
            font-size: 13px;
        }

        .resend button {
            border: none;
            background: transparent;
            color: var(--purple-light);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 500px) {
            body {
                padding:
                    max(20px, env(safe-area-inset-top))
                    15px
                    max(20px, env(safe-area-inset-bottom));
            }

            .container {
                max-width: 100%;
            }

            .verification {
                padding: 24px 18px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .code-input {
                height: 54px;
                font-size: 22px;
                letter-spacing: 7px;
            }
        }

        @media (max-width: 360px) {
            .verification {
                padding: 20px 15px;
            }

            h1 {
                font-size: 23px;
            }

            .code-input {
                letter-spacing: 5px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">N</div>

        <h1>Enter the verification code</h1>

        <p class="description">
            We sent a 6-digit verification code to
            <span id="verificationEmail">your email address</span>.
        </p>

        <form class="verification" id="verificationForm">

            <input
                class="code-input"
                id="verificationCode"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="••••••"
                required
            >

            <button class="verify-button" type="submit">
                Verify Account
            </button>

            <p class="resend">
                Need a new code?
                <button type="button" id="resendButton">
                    Resend
                </button>
            </p>

            <p class="verification-message" id="verificationMessage" role="status" aria-live="polite" hidden></p>

        </form>

    </main>

    <script src="/resources/static/js/logic.js"></script>
    <script src="/resources/static/js/verification.js"></script>

</body>
</html>
